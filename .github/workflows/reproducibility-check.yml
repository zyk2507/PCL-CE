name: Reproducibility check

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Beta
      architecture:
        description: 'Target architecture'
        required: true
        default: x64
        type: choice
        options:
          - x64
          - ARM64

jobs:
  build-a:
    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ inputs.configuration }}
      architecture: ${{ inputs.architecture }}
      artifact_name_suffix: '-repro-a'
    secrets: inherit

  build-b:
    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ inputs.configuration }}
      architecture: ${{ inputs.architecture }}
      artifact_name_suffix: '-repro-b'
    secrets: inherit

  compare:
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    steps:
      - name: Download build A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL2_CE_${{ inputs.configuration }}_${{ inputs.architecture }}-repro-a
          path: first

      - name: Download build B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL2_CE_${{ inputs.configuration }}_${{ inputs.architecture }}-repro-b
          path: second

      - name: Compare builds
        run: |
          echo "== Build A =="
          (cd first && sha256sum *)
          echo "== Build B =="
          (cd second && sha256sum *)

          if diff -r first second; then
            echo "Reproducible build check passed: both builds are byte-identical."
          else
            echo "::error::Reproducible build check failed: artifacts differ."
            exit 1
          fi
