name: Build (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      architecture:
        required: true
        type: string
      artifact_name_suffix:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build
    # 固定 runner 镜像，避免镜像滚动导致产物不可复现
    runs-on: ubuntu-24.04
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Describe
        run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # 固定 SDK 版本以保证可复现构建；升级时需同步重新生成 packages.lock.json
          dotnet-version: 10.0.402

      - name: Build Project
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
          -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.architecture }} \
          -p:DeleteExistingFiles=true \
          -p:Deterministic=true -p:ContinuousIntegrationBuild=true \
          -p:RestoreLockedMode=true \
          -p:PathMap="$GITHUB_WORKSPACE=/__w" \
          -o ./artifact --no-self-contained

      - name: Generate SHA256 checksums
        run: |
          cd artifact
          find . -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 sha256sum > /tmp/checksums.sha256
          mv /tmp/checksums.sha256 checksums.sha256
          cat checksums.sha256

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL2_CE_${{ inputs.configuration }}_${{ inputs.architecture }}${{ inputs.artifact_name_suffix }}
          path: artifact/**
